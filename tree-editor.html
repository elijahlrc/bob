<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Bob tree editor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1016;
        color: #d8d0b8;
        font:
          13px/1.4 system-ui,
          sans-serif;
        overflow: hidden;
      }
      #root {
        display: grid;
        grid-template-columns: 1fr 320px;
        height: 100%;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      aside {
        overflow-y: auto;
        padding: 10px;
        background: #171822;
        border-left: 1px solid #2c2e40;
      }
      h3 {
        margin: 14px 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8d8fa8;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
        background: #232538;
        border: 1px solid #3a3d58;
        border-radius: 4px;
        padding: 3px 7px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #30334c;
      }
      button.on {
        background: #5a4a1c;
        border-color: #e0b040;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
        align-items: center;
      }
      .row input[type='text'] {
        flex: 1;
        min-width: 0;
      }
      .row input[type='number'] {
        width: 70px;
      }
      .mods {
        white-space: pre-wrap;
        color: #a8b0c8;
        font-size: 12px;
      }
      .warn {
        color: #f0a060;
      }
      .ok {
        color: #70d090;
      }
      .links button {
        margin: 1px;
      }
      #status {
        color: #8d8fa8;
        margin-top: 8px;
      }
      kbd {
        background: #232538;
        border: 1px solid #3a3d58;
        border-radius: 3px;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="cv"></canvas>
      <aside id="side"></aside>
    </div>
    <script type="module" src="/src/treeEditor/main.ts"></script>
  </body>
</html>
