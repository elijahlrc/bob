<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Bob</title>
    <!-- Visitor counts (GoatCounter: no cookies). Localhost is not counted; allow_frame counts plays embedded on itch.io. -->

      data-goatcounter="https://elijahrc.goatcounter.com/count"
      data-goatcounter-settings='{"allow_frame": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0f1016;
        overflow: hidden;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
