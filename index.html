<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Battle of Builds</title>
    <meta
      name="description"
      content="A grimdark auto-battler you play in the browser: build a character between fights, then watch it carve through a hundred maps."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="theme-color" content="#0f1016" />
    <!-- Link previews (Reddit, Discord, Twitter/X): absolute URLs, the game as GitHub Pages serves it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Battle of Builds" />
    <meta property="og:title" content="Battle of Builds" />
    <meta
      property="og:description"
      content="A grimdark auto-battler you play in the browser: build a character between fights, then watch it carve through a hundred maps."
    />
    <meta property="og:url" content="https://elijahlrc.github.io/bob/" />
    <meta property="og:image" content="https://elijahlrc.github.io/bob/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="A bowman fighting skeletons in a torch-lit crypt" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Battle of Builds" />
    <meta
      name="twitter:description"
      content="A grimdark auto-battler you play in the browser: build a character between fights, then watch it carve through a hundred maps."
    />
    <meta name="twitter:image" content="https://elijahlrc.github.io/bob/og.png" />
    <!-- Visitor counts (GoatCounter: no cookies). Localhost is not counted; allow_frame counts plays embedded on itch.io. -->
    <script
      data-goatcounter="https://elijahrc.goatcounter.com/count"
      data-goatcounter-settings='{"allow_frame": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0f1016;
        overflow: hidden;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
