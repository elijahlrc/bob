<!doctype html>
<meta charset="utf-8" />
<title>Promo images</title>
<!-- The store page's images in Gold Leaf (docs/trailer/README.md, "Promo images"; docs/mockups/style/STYLE-GUIDE.md), drawn by
     scripts/trailer/promo.ts through the dev server: ?kind=social|wide|cover|banner|background|embed|favicon|logo|fire.
     Every surface is the game's own painter (src/ui/leaf/), the title is the title screen's hellfire, and the shots are
     stills of the trailer's clips (footage/stills/, filmed with TRAILER_SCALE=1.25 --peek: see promo.ts). -->
<style>
  html,
  body {
    margin: 0;
    background: transparent;
  }
  #c {
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    font-family: 'Grenze', Georgia, serif;
    color: var(--pearl);
  }
  #c canvas {
    display: block;
  }
  /* The title screen's hellfire (src/ui/leaf/screens.css, `.screen.title > h1`): letters stepping from pale gold down to
     ember in hard bands, a band set for each line, ringed in ink. --o is the ring's width. */
  .hf {
    --o: 3px;
    margin: 0;
    font-family: 'Jacquard 24', serif;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.06em;
    white-space: nowrap;
    text-align: center;
    color: transparent;
    background-image: linear-gradient(
      #f4dc8c 0 34%,
      #e9b04f 34% 50%,
      #d9772f 50% 64%,
      #b4401f 64% 78%,
      #7c2414 78%
    );
    background-size: 100% 1lh;
    background-repeat: repeat-y;
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(var(--o) 0 0 var(--ink)) drop-shadow(calc(-1 * var(--o)) 0 0 var(--ink))
      drop-shadow(0 var(--o) 0 var(--ink)) drop-shadow(0 calc(-1 * var(--o)) 0 var(--ink))
      drop-shadow(0 calc(2 * var(--o)) 0 #0b080599);
  }
  /* No drop below the ring (the favicon). */
  .hf.flat {
    filter: drop-shadow(var(--o) 0 0 var(--ink)) drop-shadow(calc(-1 * var(--o)) 0 0 var(--ink))
      drop-shadow(0 var(--o) 0 var(--ink)) drop-shadow(0 calc(-1 * var(--o)) 0 var(--ink));
  }
  /* A plaque: one short line on a thin-rimmed panel. */
  .plq {
    display: inline-block;
    padding: 10px 24px 12px;
    font-weight: 600;
    line-height: 1.2;
    text-shadow: 0 2px 0 var(--ink);
    white-space: nowrap;
  }
  .plq.gold {
    color: var(--gold-hi);
  }
  /* A shot in a gold-rimmed lapis frame. */
  .frame {
    position: absolute;
    box-sizing: border-box;
  }
  .frame > div {
    width: 100%;
    height: 100%;
    background-repeat: no-repeat;
    image-rendering: auto;
  }
  .col {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
<div id="c"></div>
<script type="module">
  import '@fontsource/grenze/400.css';
  import '@fontsource/grenze/600.css';
  import '@fontsource/jacquard-24/400.css';
  import '/src/ui/leaf/leaf.css';
  import { paintAll } from '/src/ui/leaf/painter.ts';

  document.documentElement.classList.add('leaf');
  const c = document.getElementById('c');

  /* The shots: stills of the trailer's clips at 1600 × 900 (the Vanguard's level 100 build on the tree, a fight among a
     pack, the Items tab, the Skills tab). */
  const SHOT = {
    tree: 'footage/stills/tree.jpg',
    fight: 'footage/stills/fight.jpg',
    items: 'footage/stills/items.jpg',
    skills: 'footage/stills/skills.jpg',
  };

  /** Sets the page's box: `wall` paints it as the game's gold wall. */
  function box(W, H, wall = true) {
    c.style.width = `${W}px`;
    c.style.height = `${H}px`;
    if (wall) c.className = 'screen';
  }
  /** Adds markup to the page's box and returns its first element. */
  function add(html, parent = c) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    const el = t.content.firstElementChild;
    parent.append(t.content);
    return el;
  }
  /** The title in hellfire, a word or a run of words to a line. */
  const title = (lines, px, o = 3) =>
    `<h1 class="hf" style="font-size:${px}px;--o:${o}px">${lines.join('<br>')}</h1>`;
  const plaque = (text, px, cls = '', field = '') =>
    `<div class="plq ${cls}" data-paint="panel" data-thin ${field ? `data-field="${field}"` : ''} style="font-size:${px}px">${text}</div>`;
  /**
   * A shot in a frame at (x, y, w, h), `pad` inside its rim: the part of the shot `cw` wide around (cx, cy), in the shot's
   * pixels (1600 × 900), as tall as the frame's shape asks.
   */
  const frame = (src, x, y, w, h, [cx, cy, cw], pad = 14) => {
    const k = (w - 2 * pad) / cw;
    const ch = (h - 2 * pad) / k;
    return `<div class="frame" data-paint="panel" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;padding:${pad}px">
      <div style="background-image:url(${src});background-size:${1600 * k}px auto;background-position:${-(cx - cw / 2) * k}px ${-(cy - ch / 2) * k}px"></div></div>`;
  };
  const GENRES = 'Arcade · ARPG · Roguelike · Autobattler';

  const KINDS = {
    /* when the page is linked: 1200 × 630. The title and the lines at the left, the tree's build framed at the right. */
    social() {
      box(1200, 630);
      add(`<div class="col" style="left:20px;top:48px;width:540px;gap:22px">
        ${title(['Battle', 'of', 'Builds'], 128, 4)}
        ${plaque(GENRES, 24)}
        ${plaque('Free in your browser', 24, 'gold', 'vermilion')}
      </div>`);
      add(frame(SHOT.tree, 570, 100, 610, 430, [810, 448, 840], 16));
    },
    /* home page featuring: 21:9, 2520 × 1080. The same, with a fight framed beside the tree. */
    wide() {
      box(2520, 1080);
      add(`<div class="col" style="left:70px;top:110px;width:960px;gap:40px">
        ${title(['Battle', 'of', 'Builds'], 236, 7)}
        ${plaque(GENRES, 46)}
        ${plaque('Free in your browser', 46, 'gold', 'vermilion')}
      </div>`);
      add(frame(SHOT.tree, 1080, 70, 1370, 940, [800, 448, 860], 24));
    },
    /* the cover on itch.io's lists, 630 × 500 (shown at half that): the title over a fight in an arched niche. */
    cover() {
      box(630, 500);
      add(
        `<div class="col" style="left:0;top:18px;width:630px">${title(['Battle of', 'Builds'], 104, 4)}</div>`,
      );
      add(frame(SHOT.fight, 40, 236, 550, 248, [775, 350, 1100], 12));
    },
    /*
     * The page's banner, 960 × 300 (the page's width), over the wall tile and above the lapis body: the wall framed by a
     * panel's gold rim on the sides and the bottom (the panel runs on past the top, so no rim there), its pixel shadow
     * falling outside; the title and the genres on a plaque inside.
     */
    banner() {
      box(960, 300, false);
      // A panel's rim and ink line take 9 art pixels from its edge (its shadow's room, then the rim): the wall goes inside.
      // The panel runs 4 px past the picture at the sides and the bottom, so its rim and an ink line outside it meet the
      // picture's edges with no gap, as wide as the body below.
      const rim = 14;
      const foot = rim;
      // An ink line round the rim's outside, so the edge reads on the gold page and on the lapis body alike.
      add(
        `<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:var(--ink)"></div>`,
      );
      add(
        `<div data-paint="panel" style="position:absolute;left:-4px;top:-40px;width:968px;height:344px"></div>`,
      );
      const wall = add(
        `<div class="screen" style="position:absolute;left:${rim}px;right:${rim}px;top:0;bottom:${foot}px"></div>`,
      );
      add(
        `<div class="col" style="left:0;top:36px;width:${960 - 2 * rim}px;gap:24px">
        ${title(['Battle of Builds'], 100, 4)}
        ${plaque(GENRES, 24)}
      </div>`,
        wall,
      );
    },
    /*
     * The page's background, a 560 × 560 tile that repeats both ways: the wall painted twice that size and folded onto
     * itself (down the tile the lower half fades into the upper, then across it the right half into the left), so each
     * edge meets the opposite one.
     */
    async background() {
      const S = 560;
      box(2 * S, 2 * S);
      await paint();
      // The painting is at art resolution (half size): fold it there, so every pixel stays one of the wall's.
      const wall = await load(c.style.backgroundImage.slice(5, -2));
      const A = wall.width / 2;
      const src = document.createElement('canvas');
      src.width = src.height = 2 * A;
      const sx = src.getContext('2d');
      sx.drawImage(wall, 0, 0);
      const px = sx.getImageData(0, 0, 2 * A, 2 * A).data;
      // Each pixel of the tile comes from one of four places in the wall: down the tile the first half is taken more and
      // more toward its end, then across it likewise, in blotches cut by smooth noise (whole pixels, never mixed), so a
      // seam reads as the wall's own mottling.
      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const lattice = Array.from({ length: 64 * 64 }, rand);
      const smooth = (u, v) => {
        const i = Math.floor(u),
          j = Math.floor(v);
        const at = (a, b) => lattice[(b & 63) * 64 + (a & 63)];
        const fu = (u - i) * (u - i) * (3 - 2 * (u - i)),
          fv = (v - j) * (v - j) * (3 - 2 * (v - j));
        const top = at(i, j) + (at(i + 1, j) - at(i, j)) * fu;
        const bot = at(i, j + 1) + (at(i + 1, j + 1) - at(i, j + 1)) * fu;
        return top + (bot - top) * fv;
      };
      const cut = (u, v) =>
        0.15 + 0.7 * (0.65 * smooth(u / 18, v / 18) + 0.35 * smooth(u / 7 + 31, v / 7));
      const tile = sx.createImageData(A, A);
      for (let j = 0; j < A; j++)
        for (let i = 0; i < A; i++) {
          const y = j / A > cut(i, j) ? j : j + A;
          const x = i / A > cut(i + 97, j + 53) ? i : i + A;
          const from = (y * 2 * A + x) * 4;
          const to = (j * A + i) * 4;
          for (let k = 0; k < 4; k++) tile.data[to + k] = px[from + k];
        }
      const small = document.createElement('canvas');
      small.width = small.height = A;
      small.getContext('2d').putImageData(tile, 0, 0);
      c.className = '';
      c.style.backgroundImage = '';
      box(S, S, false);
      const out = document.createElement('canvas');
      out.width = out.height = S;
      const o = out.getContext('2d');
      o.imageSmoothingEnabled = false;
      o.drawImage(small, 0, 0, S, S);
      c.append(out);
    },
    /*
     * Behind the game before it is run, 1280 × 720 (a smaller frame crops the middle): the gold wall with an arched lapis
     * niche in the middle, where the Run button sits. No title: the banner has it.
     */
    embed() {
      box(1280, 720);
      add(
        `<div data-paint="panel" data-arch data-pearls style="position:absolute;left:430px;top:110px;width:420px;height:500px"></div>`,
      );
    },
    /*
     * The browser tab, 512 × 512, seen at 16 to 32 pixels: one "B" in hellfire as large as the square allows, on a plain
     * flat lapis field to the edges. No rim, pearls, wear or drop: nothing that small survives.
     */
    favicon() {
      box(512, 512, false);
      add(`<div style="position:absolute;inset:0;background:var(--lapis);display:flex;align-items:center;justify-content:center">
        <h1 class="hf flat" style="font-size:680px;--o:16px;margin-left:42px">B</h1>
      </div>`);
    },
    /*
     * The phone screenshot for itch.io's gallery, which shows a tall picture badly: the phone's screen (made by
     * scripts/trailer/screenshots.ts) in a gold-rimmed frame on the wall, 1440 × 1080 (4:3).
     */
    phone() {
      box(1440, 1080);
      const h = 1012;
      const w = Math.round((h * 878) / 1899);
      add(`<div class="frame" data-paint="panel" style="left:${(1440 - w) / 2 - 14}px;top:20px;width:${w + 28}px;height:${h + 28}px;padding:14px">
        <div style="background-image:url(promo/screenshots/07-phone.png);background-size:100% 100%"></div></div>`);
    },
    /* the logo, on nothing: the hellfire title alone */
    logo() {
      box(1500, 210, false);
      add(
        `<div class="col" style="left:0;top:16px;width:1500px">${title(['Battle of Builds'], 160, 6)}</div>`,
      );
    },
    /* the fire the embed background was before (2026-10-23), kept as a choice */
    async fire() {
      box(1280, 720, false);
      const cv = document.createElement('canvas');
      c.append(cv);
      await fire(cv);
    },
  };

  const load = (src) =>
    new Promise((ok, no) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = no;
      i.src = src;
    });

  /** Paint every surface, once the fonts are in (a box's size follows its words). */
  async function paint() {
    await document.fonts.load("400 40px 'Jacquard 24'");
    await document.fonts.load("600 40px 'Grenze'");
    await document.fonts.ready;
    paintAll(document);
  }

  /*
   * The fire behind the game before it was run (the embed background of 2026-10-23), 1280 × 720 (the page shows the game's frame small; a smaller frame crops the
   * middle): a wall of fire along the bottom with smoke rising off it into the dark, in pixels `P` to a side and a few
   * colours a band. The scene is drawn 2560 × 1130 and its middle bottom kept, so the flames still burn lowest under the
   * Run button and taller toward the sides. Nothing is filmed: a seeded generator draws it the same every time. No
   * title: the banner has it.
   */
  async function fire(c) {
    const W = 2560,
      H = 1130;
    const OW = (c.width = 1280),
      OH = (c.height = 720);
    const P = 4;
    const w = W / P,
      h = Math.ceil(H / P);
    let seed = 0x0b0b;
    const rand = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // Smooth noise: a lattice of random values, eased between, in octaves.
    const lattice = new Float32Array(256 * 256).map(() => rand());
    const noise = (u, v) => {
      const i = Math.floor(u),
        j = Math.floor(v);
      const at = (a, b) => lattice[((b & 255) << 8) | (a & 255)];
      let fu = u - i,
        fv = v - j;
      fu = fu * fu * (3 - 2 * fu);
      fv = fv * fv * (3 - 2 * fv);
      const top = at(i, j) + (at(i + 1, j) - at(i, j)) * fu;
      const bot = at(i, j + 1) + (at(i + 1, j + 1) - at(i, j + 1)) * fu;
      return top + (bot - top) * fv;
    };
    const fbm = (u, v) =>
      0.5 * noise(u, v) +
      0.27 * noise(u * 2.1 + 17, v * 2.1) +
      0.15 * noise(u * 4.3 + 41, v * 4.3) +
      0.08 * noise(u * 8.7 + 83, v * 8.7);
    // Ordered dithering, so that a band's edge breaks up in a fixed pattern rather than a smooth fade.
    const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const dither = (i, j) => (BAYER[(j & 3) * 4 + (i & 3)] + 0.5) / 16;
    const rgb = (hex) => [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
    const VOID = rgb('#050406');
    const HAZE = ['#0d0507', '#160609'].map(rgb);
    const FIRE = [
      '#2a0605',
      '#420a06',
      '#5e1007',
      '#7d1807',
      '#9c2407',
      '#ba3509',
      '#d2490c',
      '#e3621a',
      '#ef7f22',
      '#f5a032',
      '#f9c454',
      '#fde79a',
    ].map(rgb);
    // Smoke lit from below near the fire, cold above it.
    const SMOKE_WARM = ['#1c100d', '#2b1914', '#3c241b'].map(rgb);
    const SMOKE_COLD = ['#130f12', '#1d181c', '#292226'].map(rgb);
    const EMBER = ['#fde79a', '#f9c454', '#ef7f22', '#d2490c', '#7d1807'].map(rgb);
    // How near (i, j) is to where the Run button sits: 1 under it, 0 well clear.
    // The kept window, in the scene's pixels: the middle, at the bottom.
    const x0 = (W - OW) / 2 / P,
      y0 = h - OH / P;
    const nearButton = (i, j) =>
      Math.max(
        0,
        1 -
          Math.hypot(
            (i - x0 - OW / P / 2) / (OW / P / 2.5),
            (j - y0 - OH / P / 2) / (OH / P / 2.9),
          ),
      );

    // The fire: how hot each pixel is, 1 at the foot and 0 where the flames end. The flames' height follows the column
    // (tall at the sides, low in the middle); noise stretched upward and bent sideways cuts that into tongues, more so
    // toward their tips.
    const reach = new Float32Array(w);
    for (let i = 0; i < w; i++) {
      const side = Math.abs(i / w - 0.5) * 2;
      reach[i] = h * (0.3 + 0.32 * Math.min(1, 0.55 * fbm(i / 40, 3.7) + 0.6 * side * side));
    }
    const heat = new Float32Array(w * h);
    for (let j = 0; j < h; j++)
      for (let i = 0; i < w; i++) {
        const y = (h - 1 - j) / reach[i];
        const u = i / 6 + 1.6 * noise(i / 26, j / 22 + 5);
        const tongue = fbm(u, j / 15) - 0.5;
        // Past a third above the column's height, no flame: no blobs adrift in the smoke.
        heat[j * w + i] = y > 1.3 ? 0 : 1 - y + 1.25 * tongue * (0.35 + y);
      }
    // Where each column's flames end.
    const top = reach.map((r) => h - 1 - r);

    const img = new ImageData(w, h);
    const put = (i, j, c) => {
      if (i < 0 || j < 0 || i >= w || j >= h) return;
      const p = (j * w + i) * 4;
      img.data[p] = c[0];
      img.data[p + 1] = c[1];
      img.data[p + 2] = c[2];
      img.data[p + 3] = 255;
    };
    for (let j = 0; j < h; j++)
      for (let i = 0; i < w; i++) {
        const t = dither(i, j);
        // How far above the flames' end, as a share of the picture.
        const a = (top[i] - j) / h;
        // A red haze just over the fire, in two steps.
        const haze = Math.floor((1 - a / 0.3) * 2 + 0.5 + 0.6 * (t - 0.5));
        let col = haze > 0 ? HAZE[Math.min(1, haze - 1)] : VOID;
        // Smoke: billows stretched upward, thickest just over the flames, gone by the top, thin over the button.
        const u = i / 26 + 1.4 * noise(i / 50, j / 34);
        const v = j / 15 + 0.8 * noise(i / 41 + 7, j / 29);
        const rise =
          Math.min(1, (a + 0.04) / 0.08) * Math.max(0, 1 - a / 0.62) * Math.min(1, j / (h * 0.18));
        const env = Math.max(0, rise) * (1 - 0.65 * nearButton(i, j));
        const s = (fbm(u, v) - 0.38) * 3.2 * env;
        const level = Math.min(3, Math.floor(s * 3 + 0.5 + 0.6 * (t - 0.5)));
        if (level > 0) col = (a + 0.1 * (t - 0.5) < 0.16 ? SMOKE_WARM : SMOKE_COLD)[level - 1];
        // The flames, over the rest.
        const f = heat[j * w + i];
        const band = f > 0 ? Math.min(12, Math.floor(Math.pow(f, 1.15) * 13 + 0.8 * (t - 0.5))) : 0;
        if (band > 0) col = FIRE[band - 1];
        put(i, j, col);
      }
    // Embers thrown up out of the flames, fewer the higher they go, none over the button; the brighter ones trail a
    // dimmer pixel below.
    for (let n = 0; n < 260; n++) {
      const i = Math.floor(rand() * w);
      const up = -Math.log(1 - rand()) * h * 0.12;
      const j = Math.round(top[i] + reach[i] * 0.35 * rand() - up);
      if (j < 2 || nearButton(i, j) > 0) continue;
      const k = Math.min(EMBER.length - 1, Math.floor((up / (h * 0.35)) * EMBER.length + rand()));
      put(i, j, EMBER[k]);
      if (k < 3) put(i + (rand() < 0.5 ? -1 : 1), j + 1, EMBER[k + 2]);
    }

    const small = document.createElement('canvas');
    small.width = w;
    small.height = h;
    small.getContext('2d').putImageData(img, 0, 0);
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(small, -x0 * P, -y0 * P, w * P, h * P);
  }

  (async () => {
    const kind = new URLSearchParams(location.search).get('kind') ?? 'social';
    await KINDS[kind]();
    await paint();
    await Promise.all(
      [...c.querySelectorAll('.frame > div')].map((d) =>
        load(d.style.backgroundImage.slice(5, -2)),
      ),
    );
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    document.title = 'ready';
  })();
</script>
