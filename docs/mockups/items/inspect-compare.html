<title>Items Tab Mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@400;500&family=Jacquard+24&display=swap" />
<style>
/* One look on purpose: the game's Gold Leaf interface (lapis panels with gold rims on a gilded ground), at phone size. */
:root {
  color-scheme: dark;
  --ground: #b8913f;
  --ground-2: #a17a2c;
  --lapis: #1b2a5c;
  --lapis-2: #22346f;
  --lapis-3: #2c4185;
  --rim: #d9b65e;
  --rim-hi: #f3d98c;
  --ink: #0b0805;
  --pearl: #efe6d0;
  --muted: #a9b0cc;
  --dim: #7d84a3;
  --up: #9fdc8a;
  --down: #ff9a8a;
  --warn: #f2c14e;
  --diff: #f2c14e;
  --magic: #8fb3ff;
  --rare: #f3d36a;
  --unique: #e6893b;
  --gem: #79d39b;
  --vermilion: #8e2a1c;
  --font: 'Grenze', 'Palatino Linotype', Georgia, serif;
  --title: 'Jacquard 24', 'Grenze', Georgia, serif;
}
html, body { height: 100%; }
body { margin: 0; background: #2a2116; color: var(--pearl); font: 17px/1.25 var(--font); padding-inline: 16px; padding-block: 16px; box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
.phone { position: relative; width: 375px; max-width: 100%; height: min(780px, calc(100vh - 32px)); min-height: 560px; margin: 0 auto; border-radius: 22px; overflow: hidden; background: var(--ground); box-shadow: 0 0 0 6px #120d08; display: flex; flex-direction: column; }
.tabsbar { flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: var(--lapis); border-bottom: 4px solid var(--rim); font-family: var(--title); font-size: 22px; }
.tabsbar b { font-weight: 400; color: var(--ink); background: var(--rim-hi); padding: 0 10px; border: 2px solid var(--ink); }
.tabsbar span { color: var(--pearl); }
.view { position: relative; flex: 1; min-height: 0; }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 10px 8px 16px; }
.campfoot { flex: none; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #2f5a35; border-top: 4px solid var(--rim); }
.campfoot .who { flex: 1; font-family: var(--title); font-size: 20px; }
.btn { background: var(--lapis-2); border: 2px solid var(--rim); box-shadow: inset 0 0 0 1px var(--ink); color: var(--pearl); padding: 6px 12px; min-height: 40px; }
.btn.small { padding: 4px 10px; min-height: 36px; font-size: 16px; }
.btn.primary { background: var(--vermilion); color: #fff1dc; }
.btn.danger { color: var(--down); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.on { background: var(--rim-hi); color: var(--ink); }
.panel { background: var(--lapis); border: 3px solid var(--rim); box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 1px var(--ink); }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
.normal { color: var(--pearl); } .magic { color: var(--magic); } .rare { color: var(--rare); } .unique { color: var(--unique); } .gem { color: var(--gem); } .flaskitem { color: var(--pearl); }

/* Bag screen, as it is now */
.geartoggle { width: 100%; text-align: left; font-size: 16px; padding: 9px 12px; }
.reliq { margin-top: 8px; padding: 14px 10px 12px; border-radius: 120px 120px 6px 6px; background: #3a1d14; border: 3px solid var(--rim); box-shadow: inset 0 0 0 2px var(--ink); }
.doll { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 62px); justify-items: center; align-items: center; }
.slotw { position: relative; }
.slot { width: 50px; height: 50px; border-radius: 50%; background: var(--lapis); border: 3px solid var(--rim); box-shadow: inset 0 0 0 2px var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); padding: 0; }
.slot.empty { border-color: #6b5631; background: #24170f; }
.slot.magic { border-color: var(--magic); } .slot.rare { border-color: var(--rare); } .slot.unique { border-color: var(--unique); }
.slot .g { font-family: var(--font); font-size: 14px; color: var(--pearl); line-height: 1; }
.slot .pp { display: flex; gap: 2px; margin-top: 2px; }
.slot.fresh, .bottle.fresh { box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 3px var(--rim-hi), 0 0 16px 6px #f3d98caa; }
@media (prefers-reduced-motion: no-preference) { .fresh { animation: fresh 1.2s ease-out 3; } @keyframes fresh { 50% { box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 3px var(--rim-hi), 0 0 4px 1px #f3d98c55; } } }
.slotx { position: absolute; top: -6px; right: -8px; width: 22px; height: 22px; padding: 0; border: 2px solid var(--rim); background: var(--lapis-2); font-size: 13px; line-height: 1; }
.flasks { display: flex; justify-content: center; gap: 14px; margin-top: 6px; }
.bottle { width: 22px; height: 34px; border-radius: 6px 6px 9px 9px; border: 2px solid var(--rim); background: #120c08; position: relative; overflow: hidden; padding: 0; }
.bottle i { position: absolute; left: 0; right: 0; bottom: 0; height: 72%; }
.upgrade-cta { display: block; margin: 10px auto 0; }
.bag { margin-top: 10px; padding: 12px 10px 10px; }
.baghead { margin: 0 0 8px; font: 400 26px/1 var(--title); }
.tools { display: flex; gap: 6px; }
.search { flex: 1; min-width: 0; background: #0f1838; color: var(--pearl); border: 2px solid var(--rim); box-shadow: inset 0 0 0 1px var(--ink); padding: 0 10px; font: 16px var(--font); height: 38px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: #0f1838; border: 1px solid var(--rim); color: var(--pearl); font-size: 15px; padding: 2px 8px; }
.chip i { font-style: normal; color: var(--rim-hi); margin-left: 4px; }
.list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--lapis-2); border: 2px solid var(--rim); box-shadow: inset 0 0 0 1px var(--ink); padding: 7px 10px 8px; }
.row.unusable .rname { opacity: .6; }
.rmain { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.newmark { width: 9px; height: 9px; flex: none; background: var(--rim-hi); transform: rotate(45deg); }
.favmark { color: var(--rim-hi); }
.rsub { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 15px; }
.nothing { color: var(--muted); padding: 8px 2px; }
.tidy { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.tidy .btn { font-size: 15px; }

/* Sheets and popups */
.veil { position: absolute; inset: 0; background: #0008; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; }
.sheethead { display: flex; align-items: center; justify-content: space-between; font-size: 19px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.ask { position: absolute; left: 16px; right: 16px; top: 22%; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.ask h3 { margin: 0; font: 400 26px/1.05 var(--title); }
.ask ul { margin: 0; padding-left: 18px; color: var(--muted); }

/* The item page and the compare page (the new parts) */
.page { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--lapis); border-top: 3px solid var(--rim); }
.phead { flex: none; height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 2px solid var(--rim); background: var(--lapis-2); }
.phead .sp { flex: 1; min-width: 0; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbody { flex: 1; overflow-y: auto; padding: 12px 12px 16px; }
.pbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 2px solid var(--rim); background: var(--lapis-2); min-height: 56px; box-sizing: border-box; }
.pbar .why { font-size: 15px; color: var(--down); min-width: 0; }
.plaque { padding: 6px 10px 7px; border: 2px solid var(--ink); font: 400 26px/1.05 var(--title); text-wrap: balance; }
.plaque.normal { background: #d9d0bb; color: var(--ink); }
.plaque.magic { background: #9cb8ee; color: #0e1a3a; }
.plaque.rare { background: #e9c35a; color: #2a1b04; }
.plaque.unique { background: #2a1a10; color: var(--unique); }
.plaque.gem { background: #7fcf9b; color: #0b2414; }
.plaque.flaskitem { background: #c9c3b4; color: var(--ink); }
.caption { display: inline-block; margin-bottom: 6px; font-size: 15px; background: var(--rim-hi); color: var(--ink); padding: 1px 8px; }
.basel { margin-top: 6px; font-size: 16px; color: var(--muted); }
.verdict { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin-top: 12px; }
.stat { background: #0f1838; border: 1px solid #3c4f8f; padding: 6px 8px; }
.stat b { display: block; font-weight: 500; font-size: 20px; line-height: 1.05; }
.stat span { font-size: 14px; color: var(--muted); }
.stat.aug b { color: var(--magic); }
.sect { margin-top: 12px; padding-top: 10px; border-top: 1px solid #3c4f8f; }
.sect h4 { margin: 0 0 6px; font: 400 15px var(--font); color: var(--muted); letter-spacing: .04em; }
.line { padding: 2px 0; }
.line.imp { color: var(--pearl); }
.line.exp { color: var(--magic); }
.line.rule { color: var(--rare); }
.req.bad { color: var(--down); }
.stones { display: inline-flex; gap: 4px; vertical-align: middle; }
.stone { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rim); background: #120c08; box-sizing: border-box; }
.stone.s { border-radius: 2px; transform: rotate(45deg) scale(.85); }
.stone.str { background: #e0664f; } .stone.dex { background: #4fbf72; } .stone.int { background: #5b8fe8; }
.stone.p { box-shadow: 0 0 0 2px var(--rim-hi); }
.wgems { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 16px; }
.picker { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: var(--lapis-2); border: 2px solid var(--rim); padding: 6px 10px; }
.prow small { display: block; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; background: #0f1838; border: 2px solid #3c4f8f; padding: 5px 4px; font-size: 15px; }
.tab b { font-weight: 500; font-size: 16px; }
.tab.on { border-color: var(--rim-hi); background: var(--lapis-3); }
.warnbox { margin-bottom: 10px; padding: 8px 10px; background: #5a1d14; border: 2px solid var(--rim); color: #ffd9cf; }
.delta { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; padding: 5px 10px; background: #0f1838; border: 1px solid #3c4f8f; font-size: 16px; }
.delta b { font-weight: 500; }
.socks .stones { margin: 0 6px; }
.socks span:last-child:not(.stones) { margin-left: auto; white-space: nowrap; }
.socks { display: flex; align-items: center; margin-top: 8px; padding: 6px 10px; background: #0f1838; border: 1px solid #3c4f8f; font-size: 15px; }
.cmp { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); font-size: 15px; border: 2px solid var(--rim); }
.cmp > div { padding: 4px 7px; border-bottom: 1px solid #33447c; min-width: 0; overflow-wrap: anywhere; }
.cmp { position: relative; }
.cmp::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--rim); }
.cmp .sec { position: relative; z-index: 1; }
.cmp .cap { background: var(--lapis-3); color: var(--muted); font-size: 14px; }
.cmp .nm { font-size: 17px; font-weight: 500; line-height: 1.1; }
.cmp .gain { color: var(--up); }
.cmp .lost { color: var(--down); }
.cmp .diff { color: var(--diff); }
.cmp .none { color: var(--dim); }
.cmp .lbl { color: var(--muted); }
.cmp .hd { background: #182456; }
.cmp .sec { grid-column: 1 / -1; padding: 0; height: 0; border-bottom: 2px solid var(--rim); }
.sect .stats { margin: 0 0 6px; }
@media (prefers-reduced-motion: no-preference) { .page { animation: slide .14s ease-out; } @keyframes slide { from { transform: translateY(14px); opacity: .6; } } }
</style>

const clone = (o) => JSON.parse(JSON.stringify(o));

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const rnd = Math.round;
function signed(v, label) { const r = rnd(v); if (!r) return ''; return `<span class="${r > 0 ? 'up' : 'down'}">${r > 0 ? '▲' : '▼'}${Math.abs(r)}% ${label}</span>`; }
function stones(sockets) {
  if (!sockets || !sockets.length) return '';
  return `<span class="stones">${sockets.map((g) => g ? `<span class="stone ${g.a}${g.s ? ' s' : ''}${g.p ? ' p' : ''}" title="${esc(g.n)}"></span>` : '<span class="stone"></span>').join('')}</span>`;
}
const linesOf = (it) => it.kind === 'flask' ? (it.lines || []) : [...(it.imp || []), ...(it.exp || []), ...(it.rules || [])];
const lineKey = (l) => l.replace(/\d+(\.\d+)?/g, 'N');
const findAny = (uid) => S.bag.find((x) => x.uid === uid) || S.pile.find((x) => x.uid === uid) || Object.values(S.worn).find((x) => x && x.uid === uid) || S.flasks.find((x) => x && x.uid === uid);
const cur = () => {
  const s = S.sel; if (!s) return null;
  if (s.from === 'inv') return S.bag.find((x) => x.uid === s.uid) || null;
  if (s.from === 'pile') return S.pile.find((x) => x.uid === s.uid) || null;

};
const flaskTab = (f) => !f ? 'Empty' : f.liquid === 'utility' ? f.name.split(' ')[0] : f.liquid[0].toUpperCase() + f.liquid.slice(1);
function counts() {
  return {
    new: S.bag.filter((x) => S.unseen.has(x.uid)).length,
    upgrades: S.bag.filter((x) => x.info && x.info.upgrade).length,
    last: S.bag.filter((x) => S.last.has(x.uid)).length,
    fav: S.bag.filter((x) => S.fav.has(x.uid)).length,

  };
}
function visible() {
  let pool = S.view === 'discarded' ? S.pile : S.bag;
  if (S.view === 'new') pool = pool.filter((x) => S.unseen.has(x.uid));
  if (S.view === 'last') pool = pool.filter((x) => S.last.has(x.uid));
  if (S.view === 'fav') pool = pool.filter((x) => S.fav.has(x.uid));
  if (S.view === 'upgrades') pool = pool.filter((x) => x.info && x.info.upgrade);
  if (S.what !== 'all') pool = pool.filter((x) => x.info && x.info.group === S.what);
  const q = S.search.trim().toLowerCase();
  if (q) pool = pool.filter((x) => x.name.toLowerCase().includes(q));
  const rar = { normal: 0, magic: 1, rare: 2, unique: 3, flaskitem: 0, gem: 0 };
  const key = {
    newest: () => 0, name: (x) => x.name, rarity: (x) => -rar[x.rar], ilvl: (x) => -(x.ilvl || 0), dps: (x) => -(x.info?.dps || 0),
    ehp: (x) => -(x.info?.ehp || 0), upgrade: (x) => -((x.info?.dps || 0) + (x.info?.ehp || 0)), slot: (x) => x.info?.slotLabel || '', fav: (x) => (S.fav.has(x.uid) ? 0 : 1),
  }[S.sort];
  let out = pool.map((x, i) => [x, i]).sort((a, b) => { const ka = key(a[0]), kb = key(b[0]); return ka < kb ? -1 : ka > kb ? 1 : a[1] - b[1]; }).map((p) => p[0]);
  if (S.desc) out = out.reverse();

}
const junk = () => S.bag.filter((x) => x.kind === 'item' && (x.rar === 'normal' || x.rar === 'magic') && !(x.info && x.info.upgrade) && !S.fav.has(x.uid));

/* ---------- The bag screen: as the game has it now ---------- */
function rowHtml(it, pile) {
  const i = it.info || {};
  const gear = i.group !== 'gem' && i.group !== 'flask';
  const sub = [`<span class="muted">${esc(i.slotLabel || '')}</span>`];
  if (it.multi && i.slot) sub.push(`<span>→ ${esc(i.slotName)}</span>`);
  if (i.fillsFlask) sub.push('<span class="up">▲ empty flask slot</span>');
  if (gear && i.eq) { sub.push(signed(i.dps, 'DPS'), signed(i.ehp, 'EHP')); }
  if (gear && i.eq && i.gemsOut) sub.push(`<span class="warn">⚠ ${i.gemsOut} gem${i.gemsOut > 1 ? 's' : ''} out</span>`);
  if (gear && i.eq && i.idle && i.idle.length) sub.push(`<span class="warn">⚠ ${esc(i.idle[0])} stops</span>`);
  if (!i.eq && i.group !== 'gem') sub.push('<span class="down">can\'t use</span>');
  return `<button class="row ${i.eq || i.group === 'gem' ? '' : 'unusable'}" data-a="open" data-v="${it.uid}" data-pile="${pile ? 1 : ''}">
    <span class="rmain">${S.unseen.has(it.uid) ? '<i class="newmark" aria-label="New"></i>' : ''}${S.fav.has(it.uid) ? '<span class="favmark">★</span>' : ''}<span class="rname ${it.rar}">${esc(it.name)}</span></span>
    <span class="rsub">${sub.filter(Boolean).join('')}</span></button>`;
}

  const active = (S.what !== 'all' ? 1 : 0) + (S.view !== 'all' ? 1 : 0);

  const summary = `Gear · ${worn.length} of 10 worn` + (gems ? ` · ${gems} gem${gems === 1 ? '' : 's'}` : '') + (sockets - gems ? ` · ${sockets - gems} free socket${sockets - gems === 1 ? '' : 's'}` : '');

      return `<div class="slotw" style="grid-column:${col};grid-row:${row}">

        ${it ? `<button class="slotx" data-a="takeoff" data-v="${k}" aria-label="Take off ${esc(it.name)}">×</button>` : ''}</div>`;
    }).join('');
    const fl = S.flasks.map((f, i) => `<button class="bottle${S.fresh === 'f' + i ? ' fresh' : ''}" data-a="flask" data-v="${i}" aria-label="Flask ${i + 1}: ${f ? esc(f.name) : 'empty'}">${f ? `<i style="background:${LIQUID[f.liquid]}"></i>` : ''}</button>`).join('');
    h += `<div class="reliq"><div class="doll">${slots}</div><div class="flasks">${fl}</div></div>`;
  }
  if (c.upgrades && S.view !== 'upgrades') h += `<button class="btn primary upgrade-cta" data-a="best">${c.upgrades} upgrade${c.upgrades > 1 ? 's' : ''} in the bag: show them</button>`;

  if (filtered) {
    h += '<div class="chips">';
    if (S.what !== 'all') h += `<button class="chip" data-a="clrwhat">${WHATS.find((w) => w[0] === S.what)[1]}<i>×</i></button>`;
    if (S.view !== 'all') h += `<button class="chip" data-a="clrview">${VIEWS.find((w) => w[0] === S.view)[1]} (${c[S.view]})<i>×</i></button>`;

  </div></div>`;
  return h;

function statCells(it) {
  const cells = [];
  if (it.wl) {
    const [lo, label] = [it.wl.phys.replace(' physical', ''), 'physical damage'];
    cells.push([lo, label, it.wl.aug[0]], [it.wl.speed.replace(' APS', ''), 'attacks a second', it.wl.aug[1]], [it.wl.crit.replace(' crit', ''), 'critical chance', it.wl.aug[2]]);

  return `<div class="stats">${cells.map(([v, l, aug]) => `<div class="stat ${aug ? 'aug' : ''}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>`;

/* ---------- The compare page: both items side by side, lines aligned (new) ---------- */
function alignLines(a, b) {

    const k = lineKey(l);
    const j = lb.findIndex((m, idx) => !used.has(idx) && lineKey(m) === k);
    if (j >= 0) { used.add(j); rows.push([l, lb[j], l === lb[j] ? 'same' : 'diff']); }

}
function keyNumbers(it) {

const num = (v) => { const m = String(v).match(/[\d.]+/g); return m ? m.map(Number).reduce((a, b) => a + b, 0) / m.length : null; };

  if (x.wl) { out.push(big(x.wl.phys), big(x.wl.speed), big(x.wl.crit)); for (const e of x.wl.extra) out.push(big(`${e} added`)); }

  for (const l of x.imp || []) out.push({ k: lineKey(l), t: l, html: esc(l) });

}
/** The stats an item's affixes give. */
function affixEntries(x) {

}
/**

function section(title, A, B) {

    h += `<div class="${cls}">${a.html}</div><div>${b.html}</div>`;
  }
  for (let i = 0; i < Math.max(restA.length, restB.length); i++) {
    h += restA[i] ? `<div class="gain">${restA[i].html}</div>` : '<div></div>';
    h += restB[i] ? `<div class="lost">${restB[i].html}</div>` : '<div></div>';

}
function comparePage() {
  const it = cur();

  let tabs = '', top = '', old = null, label = '', ok = true, why = '';

    const fc = it.fcmp; const idx = S.aim ?? fc.find((x) => x.chosen).idx;
    old = S.flasks[idx];
    tabs = `<div class="tabs" role="tablist">${fc.map((x) => `<button class="tab ${x.idx === idx ? 'on' : ''}" data-a="aim" data-v="${x.idx}"><b>${flaskTab(S.flasks[x.idx])}</b><span class="muted">Flask ${x.idx + 1}</span></button>`).join('')}</div>`;
    label = `Flask ${idx + 1}`;
  } else {
    const slots = it.cmp;
    const a = slots.find((x) => x.slot === S.aim) || slots.find((x) => x.best) || slots[0];
    old = S.worn[a.slot] || null; label = a.label; ok = a.ok; why = a.why || '';

    }
    if (!a.ok) top += `<div class="warnbox">${esc(a.why)}</div>`;
    else {
      const big = (v, l) => { const r = rnd(v); return `<span><b class="${r > 0 ? 'up' : r < 0 ? 'down' : ''}">${r > 0 ? '+' : r < 0 ? '−' : '±'}${Math.abs(r)}%</b> ${l}</span>`; };
      top += `<div class="delta">${big(a.dps, 'damage')}${big(a.ehp, 'effective HP')}</div>`;

  g += cell('hd', `<div class="nm ${it.rar}">${esc(it.name)}</div>`) + cell('hd', old ? `<div class="nm ${old.rar}">${esc(old.name)}</div>` : none);
  if (!flask) {

    g += cell(ok ? 'lbl' : 'lost', `Requires ${esc(it.req)} · ilvl ${it.ilvl}`) + cell('lbl', old ? `Requires ${esc(old.req)} · ilvl ${old.ilvl}` : none);
    if (it.sockets.length || (old && old.sockets.length)) g += cell('', it.sockets.length ? stones(it.sockets) : '<span class="none">no sockets</span>') + cell('', old && old.sockets.length ? stones(old.sockets) : '<span class="none">no sockets</span>');

  return `<div class="page"><div class="phead"><button class="btn small" data-a="back">‹ Item</button><span class="sp">Compare</span></div>
    <div class="pbody">${tabs}${top}<div class="cmp">${g}</div></div><div class="pbar">${bar}</div></div>`;
}

/* ---------- Actions ---------- */
function snapshot() { S.undo.push(JSON.stringify({ worn: S.worn, flasks: S.flasks, bag: S.bag, pile: S.pile, unseen: [...S.unseen], fav: [...S.fav] })); }
function restore() {
  const o = JSON.parse(S.undo.pop());
  Object.assign(S, { worn: o.worn, flasks: o.flasks, bag: o.bag, pile: o.pile, unseen: new Set(o.unseen), fav: new Set(o.fav) });
  if (!cur()) { S.sel = null; S.screen = 'bag'; }
}
function infoFor(it, slot) {
  const g = it.wtype ? 'weapon' : ['ring1', 'ring2', 'amulet', 'belt'].includes(slot) ? 'jewellery' : 'armour';
  return { slotLabel: SLOT_GROUP[slot], slot, slotName: SLOT_LABEL[slot], eq: true, dps: 0, ehp: 0, gemsOut: 0, idle: [], group: g, upgrade: false };
}
function wear() {
  const it = cur();
  if (it.kind === 'flask') {
    const idx = S.aim ?? it.fcmp.find((x) => x.chosen).idx;
    const old = S.flasks[idx];
    snapshot();
    S.bag = S.bag.filter((x) => x.uid !== it.uid);
    S.flasks[idx] = { uid: it.uid, kind: 'flask', name: it.name, rar: it.rar, sub: it.sub, lines: it.lines, liquid: it.liquid };
    if (old) S.bag.unshift({ ...old, info: { slotLabel: 'Flask', eq: true, dps: 0, ehp: 0, gemsOut: 0, idle: [], group: 'flask', upgrade: false }, fcmp: [0, 1, 2, 3, 4].map((k) => ({ idx: k, eq: null, ok: true, chosen: k === idx })) });
    backToGear('f' + idx); return;
  }
  const a = it.cmp.find((x) => x.slot === S.aim) || it.cmp.find((x) => x.best) || it.cmp[0];
  const go = () => {
    snapshot();
    const old = S.worn[a.slot];
    S.bag = S.bag.filter((x) => x.uid !== it.uid);
    const { info, cmp, multi, ...bare } = it;
    S.worn[a.slot] = bare;
    if (old) {
      // What the old item would do if it went back: the swap undone (the mock-up does not recalculate the rest).
      const back = { slot: a.slot, label: a.label, eq: bare.uid, ok: true, dps: -a.dps, ehp: -a.ehp, chips: { life: -a.chips.life, es: -a.chips.es, mana: -a.chips.mana, res: a.chips.res.map((v) => -v) }, note: { severity: 'none', text: '' }, out: 0, idle: 0, best: true };
      S.bag.unshift({ ...old, info: { ...infoFor(old, a.slot), dps: -a.dps, ehp: -a.ehp }, cmp: [back], multi: !!it.multi });
    }
    backToGear(a.slot);
  };
  // The game asks first only when a skill gem would stop working; no swap in this data does that.
  go();
}
/** After wearing something: back to the bag, the gear open and scrolled into view, the slot just filled lit for a moment. */
function backToGear(slot) {
  Object.assign(S, { screen: 'bag', sel: null, aim: null, justOff: null, gearOpen: true, fresh: slot });
  render();
  const sc = document.getElementById('scroll');
  const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  sc.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
}
function discard() {
  const it = cur();
  const go = () => {
    const list = visible(); const i = list.findIndex((x) => x.uid === it.uid); const next = list[i + 1] || list[i - 1];
    snapshot();
    S.bag = S.bag.filter((x) => x.uid !== it.uid); S.pile.unshift({ ...it, dust: 1 });
    if (next && next.uid !== it.uid) S.sel = { from: 'inv', uid: next.uid }; else { S.sel = null; S.screen = 'bag'; }
    render();
  };
  if (S.fav.has(it.uid)) { S.ask = { title: 'Discard a favourite?', body: `${it.name} is starred.`, confirm: 'Discard it', onYes: go }; render(); return; }
  go();
}
function act(a, v, el) {
  S.fresh = null;

    case 'gear': S.gearOpen = !S.gearOpen; break;
    case 'open': {
      const uid = Number(v); const pile = el.dataset.pile === '1';
      S.sel = { from: pile ? 'pile' : 'inv', uid }; S.screen = 'item'; S.aim = null; S.justOff = null;
      if (!pile) S.unseen.delete(uid);
      break;
    }
    case 'slot': if (S.worn[v]) { S.sel = { from: 'slot', slot: v }; S.screen = 'item'; S.justOff = null; } else return; break;
    case 'flask': if (S.flasks[v]) { S.sel = { from: 'flask', idx: Number(v) }; S.screen = 'item'; S.justOff = null; } else return; break;
    case 'takeoff': { const it = S.worn[v]; if (!it) return; snapshot(); S.worn[v] = null; S.bag.unshift({ ...it, info: infoFor(it, v), cmp: [{ slot: v, label: SLOT_LABEL[v], eq: null, ok: true, dps: 0, ehp: 0, chips: { life: 0, es: 0, mana: 0, res: [0, 0, 0, 0, 0] }, note: { severity: 'none', text: '' }, out: 0, idle: 0, best: true }] }); S.sel = { from: 'inv', uid: it.uid }; S.screen = 'item'; S.justOff = null; break; }
    case 'takeoffflask': { const i = Number(v), f = S.flasks[i]; if (!f) return; snapshot(); S.flasks[i] = null; S.bag.unshift({ ...f, info: { slotLabel: 'Flask', eq: true, dps: 0, ehp: 0, gemsOut: 0, idle: [], fillsFlask: true, group: 'flask', upgrade: true }, fcmp: [0, 1, 2, 3, 4].map((k) => ({ idx: k, eq: null, ok: true, chosen: k === i })) }); S.sel = { from: 'inv', uid: f.uid }; S.screen = 'item'; break; }
    case 'back': S.screen = S.screen === 'compare' ? 'item' : 'bag'; if (S.screen === 'bag') { S.sel = null; S.justOff = null; } break;
    case 'compare': S.screen = 'compare'; break;
    case 'aim': S.aim = isNaN(Number(v)) ? v : Number(v); break;
    case 'swap': wear(); break;
    case 'fav': { const it = cur(); S.fav.has(it.uid) ? S.fav.delete(it.uid) : S.fav.add(it.uid); break; }
    case 'step': {
      const list = visible(); const i = list.findIndex((x) => x.uid === S.sel.uid);
      const n = list[Math.max(0, Math.min(list.length - 1, i + Number(v)))];
      if (n) { S.sel = { from: S.sel.from, uid: n.uid }; S.unseen.delete(n.uid); S.justOff = null; }
      break;
    }
    case 'discard': discard(); return;
    case 'putback': { const it = cur(); snapshot(); S.pile = S.pile.filter((x) => x.uid !== it.uid); S.bag.unshift(it); S.sel = null; S.screen = 'bag'; break; }
    case 'socket': S.ask = { title: 'Socket', body: 'The Skills tab opens here, with this gem picked and every socket it can go in lit.', confirm: 'OK', onYes: () => {} }; break;
    case 'best': {
      // Filter the bag to its upgrades, best first, and bring the bag into view.
      Object.assign(S, { search: '', what: 'all', view: 'upgrades', sort: 'upgrade', desc: false });
      render();
      const sc = document.getElementById('scroll'), bag = sc.querySelector('.bag');
      sc.scrollTo({ top: bag.offsetTop - 8, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      return;
    }
    case 'sheet': S.sheet = true; break;
    case 'closesheet': S.sheet = false; break;
    case 'view': S.view = v; break;
    case 'what': S.what = v; break;
    case 'desc': S.desc = !S.desc; break;
    case 'clrwhat': S.what = 'all'; break;
    case 'clrview': S.view = 'all'; break;
    case 'clear': S.what = 'all'; S.view = 'all'; S.search = ''; break;
    case 'seen': S.unseen.clear(); break;
    case 'cleanup': S.ask = { title: 'Clean up old items', body: 'The Clean up screen opens here, as it does now.', confirm: 'OK', onYes: () => {} }; break;
    case 'junk': { const j = junk(); S.ask = { title: 'Salvage the junk?', body: 'Every normal or magic item that is not an upgrade and not a favourite is broken down for good.', facts: [`${j.length} item${j.length > 1 ? 's' : ''}`, `${j.length} Bone Dust`], confirm: `Salvage ${j.length} for ${j.length} Bone Dust`, onYes: () => { const ids = new Set(j.map((x) => x.uid)); S.bag = S.bag.filter((x) => !ids.has(x.uid)); } }; break; }
    case 'salvpile': S.ask = { title: 'Salvage everything discarded?', body: 'Every discarded item is broken down for good. This cannot be undone.', facts: [`${S.pile.length} item${S.pile.length > 1 ? 's' : ''}`, `${S.pile.length} Bone Dust`], confirm: `Salvage ${S.pile.length} for ${S.pile.length} Bone Dust`, onYes: () => { S.pile = []; S.undo = []; if (S.view === 'discarded') S.view = 'all'; } }; break;
    case 'askyes': { const f = S.ask.onYes; S.ask = null; f(); break; }
    case 'askno': S.ask = null; break;

}

const view = document.getElementById('view');
const undoBtn = document.getElementById('undo');

  if (e.target.id === 'search') { S.search = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos); }
});
view.addEventListener('change', (e) => { if (e.target.id === 'sort') { S.sort = e.target.value; render(); } });
render();
// The worn gear is open, but the tab opens scrolled past it, on the bag: scroll up to see it.
function scrollPastGear() {
  const sc = document.getElementById('scroll');
  const first = sc && (sc.querySelector('.upgrade-cta') || sc.querySelector('.bag'));
  if (first) sc.scrollTop = first.offsetTop - 8;
}
scrollPastGear();
// Again once the fonts are in, since they change the gear's height.
if (document.fonts) document.fonts.ready.then(() => { if (S.screen === 'bag' && !S.undo.length) scrollPastGear(); });
</script>
